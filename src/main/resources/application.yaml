spring:
  application:
    name: game-backend
  threads:
    virtual:
      enabled: true

game:
  cache:
    news:
      expire-after-write: 30s
    top-leaderboard:
      expire-after-write: 30s
    display-names:
      refresh-after-write: 5m
      expire-after-write: 10m
      maximum-size: 100000
  clients:
    config:
      refresh-interval: 30s
      base-url: "http://localhost:8083/"
      connect-timeout: 250ms
      request-timeout: 500ms
      max-retries: 1
      circuit-breaker:
        max-failures: 5
        reset-timeout: 5s
    leaderboard:
      base-url: "http://localhost:8083/"
      connect-timeout: 250ms
      request-timeout: 500ms
      max-retries: 1
      circuit-breaker:
        max-failures: 5
        reset-timeout: 5s
    news:
      base-url: "http://localhost:8083/"
      connect-timeout: 250ms
      request-timeout: 500ms
      max-retries: 1
      circuit-breaker:
        max-failures: 5
        reset-timeout: 5s
    player-profile:
      base-url: "http://localhost:8083/"
      connect-timeout: 250ms
      request-timeout: 500ms
      max-retries: 1
      circuit-breaker:
        max-failures: 5
        reset-timeout: 5s
